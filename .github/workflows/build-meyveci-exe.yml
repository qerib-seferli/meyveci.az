name: Build Meyveci Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'EXE versiyası (məs: 1.0.1)'
        required: false
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Repo-nu yüklə
        uses: actions/checkout@v4

      - name: Meyveci ikonunu hazırla
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          from pathlib import Path

          src = Path('assets/img/logo/pwa-icon-512.png')
          dst = Path('windows-exe/meyveci.ico')
          image = Image.open(src).convert('RGBA')
          image.save(dst, format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print(f'Icon yaradıldı: {dst}')
          '@ | python -

      - name: Windows launcher EXE-ni compile et
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) {
            throw "C# compiler tapılmadı: $csc"
          }

          & $csc `
            /nologo `
            /target:winexe `
            /optimize+ `
            /win32icon:windows-exe\meyveci.ico `
            /out:windows-exe\Meyveci.exe `
            windows-exe\MeyveciLauncher.cs

          if (!(Test-Path 'windows-exe\Meyveci.exe')) {
            throw 'Meyveci.exe yaranmadı.'
          }

      - name: Inno Setup hazırla
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler tapılmadı: $iscc"
          }

          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '1.0.0'
          }

          Push-Location windows-exe
          try {
            & $iscc "/DMyAppVersion=$version" 'meyveci_setup.iss'
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path 'windows-exe\dist\MeyveciSetup.exe')) {
            throw 'MeyveciSetup.exe yaranmadı.'
          }

      - name: SHA256 yoxlama faylı yarat
        shell: powershell
        run: |
          $hash = (Get-FileHash 'windows-exe\dist\MeyveciSetup.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  MeyveciSetup.exe" | Out-File -FilePath 'windows-exe\dist\MeyveciSetup.sha256.txt' -Encoding ascii
          Get-Item 'windows-exe\dist\MeyveciSetup.exe' | Format-List Name,Length,LastWriteTime
          Get-Content 'windows-exe\dist\MeyveciSetup.sha256.txt'

      - name: Hazır installer-i artifact kimi yüklə
        uses: actions/upload-artifact@v4
        with:
          name: MeyveciSetup
          path: |
            windows-exe/dist/MeyveciSetup.exe
            windows-exe/dist/MeyveciSetup.sha256.txt
          if-no-files-found: error
          retention-days: 30
